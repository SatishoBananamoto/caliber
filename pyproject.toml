[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caliber-trust"
version = "0.2.0"
description = "Calibration instrument for AI agents: measure calibration, stress-test records, and verify cards."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Satish Patil", email = "satishpatil@proton.me"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "agents", "trust", "calibration", "a2a", "mcp"]
dependencies = ["click>=8.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["hypothesis>=6.0", "mcp>=1.0", "pytest>=8.0"]

[project.scripts]
caliber = "caliber.cli:main"

[project.urls]
Homepage = "https://github.com/SatishoBananamoto/caliber"
Repository = "https://github.com/SatishoBananamoto/caliber"

[tool.setuptools.packages.find]
include = ["caliber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
